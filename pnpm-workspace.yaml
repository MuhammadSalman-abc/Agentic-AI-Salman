packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  '@modelcontextprotocol/sdk': 1.32.1
  sharp: 0.35.5
  source-map-js: 1.2.2
  # MCP SDK supports both Zod majors; keep it on the patched v4 implementation.
  zod: 4.6.7
  # Security fixes within the existing dependency major versions.
  body-parser: 2.4.0
  undici: 7.30.1
  systeminformation: 5.33.16

audit:
  level: high
  # The braces@3.0.3 backport in patches/braces@3.0.3.patch enforces a 100-level
  # nesting cap. Remove this exact advisory exception when an upstream fixed release exists.
  ignore:
    - GHSA-vfj7-8cjw-p6xm

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

minimumReleaseAgeExclude:
  - shadcn@4.23.0
